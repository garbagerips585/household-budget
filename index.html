<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1E5B66" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1A1D" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Our Money">
  <title>Our Money</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="demo-banner" role="note">Demo with made-up numbers. Don't enter real info yet.</div>

  <div class="shell">
    <nav class="nav" aria-label="Sections">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>Our Money</span>
      </div>
      <a href="#/home" data-route="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/activity" data-route="activity"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Activity</span></a>
      <a href="#/bills" data-route="bills"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Bills</span></a>
      <a href="#/taxes" data-route="taxes"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span>Taxes</span></a>
      <a href="#/checkin" data-route="checkin"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="8.5" cy="9" r="3"/><circle cx="15.5" cy="9" r="3"/><path d="M3 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M12.5 17.2c.8-1.4 1.9-2.2 3-2.2 2.7 0 4.9 1.8 5.5 5"/></svg><span>Check-in</span></a>
    </nav>

    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab" id="addBtn" type="button" aria-label="Add a transaction">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="addSheet" class="sheet" aria-labelledby="addTitle">
    <form method="dialog" id="addForm">
      <div class="sheet-head">
        <h2 id="addTitle">Add a transaction</h2>
        <button type="button" class="link" id="addCancel">Cancel</button>
      </div>

      <label class="amount-field">
        <span class="sr-only">Amount</span>
        <span class="currency" aria-hidden="true">$</span>
        <input name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" required pattern="^\d+(\.\d{0,2})?$">
      </label>

      <div class="seg" role="radiogroup" aria-label="Money in or out">
        <label><input type="radio" name="dir" value="out" checked><span>Spent</span></label>
        <label><input type="radio" name="dir" value="in"><span>Received</span></label>
      </div>

      <label class="field"><span>Where</span><input name="payee" autocomplete="off" placeholder="Wegmans" required></label>
      <label class="field"><span>Category</span><select name="category" id="catSelect"></select></label>
      <label class="field"><span>Account</span><select name="account" id="acctSelect"></select></label>

      <fieldset class="who">
        <legend>Whose is it</legend>
        <div class="seg">
          <label><input type="radio" name="owner" value="shared" checked><span>Ours</span></label>
          <label><input type="radio" name="owner" value="tim"><span>Tim</span></label>
          <label><input type="radio" name="owner" value="scott"><span>Scott</span></label>
        </div>
      </fieldset>

      <label class="toggle">
        <input type="checkbox" name="private">
        <span class="toggle-ui" aria-hidden="true"></span>
        <span>Keep the details private<small>The amount still counts. Handy for gifts.</small></span>
      </label>

      <label class="field"><span>Note</span><input name="note" autocomplete="off" placeholder="Optional"></label>

      <button class="primary" type="submit">Save transaction</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
